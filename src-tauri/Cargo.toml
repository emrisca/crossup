[package]
name = "crossup"
version = "0.2.7"
description = "Key remapper and SOCD tool, rebuilt on Tauri"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crossup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# One process per machine: the second launch focuses the first one's window
# instead of installing a competing keyboard hook.
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# Only for the "choose the executable" button in settings, and only from Rust.
tauri-plugin-dialog = "2"
# Self-update. The release workflow signs each installer with the key whose
# public half sits in tauri.conf.json, and this refuses anything that signature
# does not cover.
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  # The sign-in entry lives in HKCU\...\CurrentVersion\Run.
  "Win32_System_Registry",
  # Monitor rectangles: the edge and corner failsafes are measured against each
  # screen, not against the bounding box of all of them.
  "Win32_Graphics_Gdi",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
